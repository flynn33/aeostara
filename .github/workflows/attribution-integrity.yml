# Aeostara Attribution Integrity
# Blocks commits and pushes containing generated-work attribution markers.
# Copyright (c) 2026 James Daley. All Rights Reserved.

name: Attribution Integrity

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  check-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages for generated-work attribution
        id: check-commits
        run: |
          FOUND=0

          PATTERNS=(
            "[Cc]o-[Aa]uthored-[Bb]y:"
            "[Gg]enerated[[:space:]]+by"
            "[Cc]reated[[:space:]]+with"
            "[Ww]ritten[[:space:]]+by"
            "[Aa]ssisted[[:space:]]+by"
            "[Mm]achine-generated"
            "[Mm]odel-generated"
            "[Aa]utomation-generated"
          )

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.event.after }}"
            if echo "${{ github.event.before }}" | grep -q "^0\{40\}$"; then
              RANGE="${{ github.event.after }}"
            fi
          fi

          if ! MESSAGES=$(git log "$RANGE" --pretty=format:"%H %s%n%b" 2>/dev/null); then
            MESSAGES=$(git log -1 --pretty=format:"%H %s%n%b")
          fi

          for PATTERN in "${PATTERNS[@]}"; do
            if MATCHES=$(echo "$MESSAGES" | grep -iE "$PATTERN"); then
              echo "::error::Generated-work attribution found in commit message."
              echo "$MATCHES"
              FOUND=1
            fi
          done

          echo "commits_found=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Check file contents for generated-work attribution
        id: check-files
        run: |
          FOUND=0

          FILE_PATTERNS=(
            "[Cc]o-[Aa]uthored-[Bb]y:"
            "[Gg]enerated[[:space:]]+by"
            "[Cc]reated[[:space:]]+with"
            "[Ww]ritten[[:space:]]+by"
            "[Aa]ssisted[[:space:]]+by"
            "[Mm]achine-generated"
            "[Mm]odel-generated"
            "[Aa]utomation-generated"
          )

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            DIFF_RANGE="${{ github.event.before }}..${{ github.event.after }}"
            if echo "${{ github.event.before }}" | grep -q "^0\{40\}$"; then
              DIFF_RANGE=""
            fi
          fi

          if [ -n "$DIFF_RANGE" ]; then
            if ! DIFF_CONTENT=$(git diff "$DIFF_RANGE" --unified=0 -- '*.h' '*.cpp' '*.hpp' '*.md' '*.json' '*.txt' '*.cmake' '*.ps1' 2>/dev/null); then
              DIFF_CONTENT=""
            fi
          else
            if ! DIFF_CONTENT=$(git diff --no-index /dev/null . --unified=0 -- '*.h' '*.cpp' '*.hpp' '*.md' '*.json' '*.txt' '*.cmake' '*.ps1' 2>/dev/null); then
              DIFF_CONTENT=""
            fi
          fi

          for PATTERN in "${FILE_PATTERNS[@]}"; do
            if MATCHES=$(echo "$DIFF_CONTENT" | grep -n "^\+" | grep -iE "$PATTERN"); then
              echo "::error::Generated-work attribution found in file contents."
              echo "$MATCHES" | head -20
              FOUND=1
            fi
          done

          echo "files_found=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Fail if generated-work attribution is detected
        if: steps.check-commits.outputs.commits_found == '1' || steps.check-files.outputs.files_found == '1'
        run: |
          echo "::error::Generated-work attribution detected in this push/PR."
          echo "Remove generated-work attribution markers and resubmit."
          exit 1

      - name: Pass
        if: steps.check-commits.outputs.commits_found != '1' && steps.check-files.outputs.files_found != '1'
        run: echo "No generated-work attribution found. Check passed."
