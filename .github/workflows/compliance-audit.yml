# Aeostara Base Compliance Audit

name: Compliance Audit

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'REMEDIATION_STATUS.md'
      - 'BASE_DESIGN_COMPLETION.md'
      - 'ASH_BASELINE_REFERENCE.md'
      - 'specs/**'
      - 'conformance/**'
      - 'fixtures/conformance/**'
      - 'fixtures/schema_examples/**'
      - 'implementation_handoff/**'
      - 'templates/platform_repo/**'
      - 'ci/**'
  pull_request:
    paths:
      - 'README.md'
      - 'REMEDIATION_STATUS.md'
      - 'BASE_DESIGN_COMPLETION.md'
      - 'ASH_BASELINE_REFERENCE.md'
      - 'specs/**'
      - 'conformance/**'
      - 'fixtures/conformance/**'
      - 'fixtures/schema_examples/**'
      - 'implementation_handoff/**'
      - 'templates/platform_repo/**'
      - 'ci/**'

jobs:
  compliance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run base-design compliance checker
        run: python ci/compliance_checker.py . --mode all

      - name: Run completion checker
        run: python ci/base_design_completion_checker.py .

      - name: Run workflow integrity checker
        run: python ci/workflow_integrity_checker.py .
