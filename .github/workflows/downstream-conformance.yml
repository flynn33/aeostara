# Aeostara Base Design Conformance Audit

name: Base Design Conformance

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'REMEDIATION_STATUS.md'
      - 'BASE_DESIGN_COMPLETION.md'
      - 'ASH_BASELINE_REFERENCE.md'
      - 'specs/**'
      - 'conformance/**'
      - 'fixtures/conformance/**'
      - 'fixtures/schema_examples/**'
      - 'implementation_handoff/**'
      - 'templates/platform_repo/**'
      - 'ci/**'
      - 'branch_profiles/**'
      - 'agentic-coding-policy.json'
  pull_request:
    paths:
      - 'README.md'
      - 'REMEDIATION_STATUS.md'
      - 'BASE_DESIGN_COMPLETION.md'
      - 'ASH_BASELINE_REFERENCE.md'
      - 'specs/**'
      - 'conformance/**'
      - 'fixtures/conformance/**'
      - 'fixtures/schema_examples/**'
      - 'implementation_handoff/**'
      - 'templates/platform_repo/**'
      - 'ci/**'
      - 'branch_profiles/**'
      - 'agentic-coding-policy.json'

jobs:
  base-design-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run base-design conformance suite
        run: python ci/conformance_runner.py .
